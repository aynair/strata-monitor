# strata-monitor reverse proxy (nginx).
#
# The monitor itself serves plain HTTP on 127.0.0.1:8090 only; nginx
# terminates TLS and is the only thing reachable from the network.
#
# Per-host edits (nothing here is baked into the app):
#   - server_name        -> your hostname
#   - ssl_certificate    -> your cert (e.g. /etc/ssl/certs/<host>.crt)
#   - ssl_certificate_key-> your key  (e.g. /etc/ssl/private/<host>.key)
#
# Install: copy to /etc/nginx/sites-available/strata-monitor, symlink into
# sites-enabled, edit the placeholders, then: nginx -t && systemctl reload nginx

# Optional: redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.example.com;

    # EDIT these two per host.
    ssl_certificate     /etc/ssl/certs/YOUR.crt;
    ssl_certificate_key /etc/ssl/private/YOUR.key;

    # TLS hardening (tune to your environment).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS lives here, at the proxy, not in the monitor.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
