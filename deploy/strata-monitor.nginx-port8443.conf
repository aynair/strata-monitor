# strata-monitor reverse proxy (nginx) on a non-standard HTTPS port.
#
# Use this when you already have a site on 443 and just want to add the
# monitor on its own port (no new DNS, no SNI juggling).
#
# The monitor serves plain HTTP on 127.0.0.1:8090 only; nginx terminates TLS
# here, so the monitor never needs the private key.
#
# Per-host edits:
#   - server_name         -> the hostname you browse (cert must match it)
#   - ssl_certificate     -> your cert (e.g. /etc/ssl/certs/ai.crt)
#   - ssl_certificate_key -> your key  (e.g. /etc/ssl/private/ai.key)
#
# Install:
#   sudo cp this-file /etc/nginx/sites-available/strata-monitor
#   sudo ln -s /etc/nginx/sites-available/strata-monitor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 8443/tcp        # if you have a firewall
# Browse: https://<host>:8443/

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name monitor.example.com;

    # EDIT these two per host (reuse your existing cert/key if it matches).
    ssl_certificate     /etc/ssl/certs/YOUR.crt;
    ssl_certificate_key /etc/ssl/private/YOUR.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS lives here, at the proxy, not in the monitor.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Optional: redirect plain HTTP on 8080 to HTTPS on 8443.
# server {
#     listen 8080;
#     listen [::]:8080;
#     server_name monitor.example.com;
#     return 301 https://$host:8443$request_uri;
# }
